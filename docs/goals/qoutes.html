    function updateDateTime() {

// --- Clock Modal ---
document.getElementById('currentTime').addEventListener('click', () => {
  document.getElementById('clockModal').style.display = 'flex';
  drawAnalogClock(); // draw once
  if (!window.clockTimer) {
    window.clockTimer = setInterval(drawAnalogClock, 1000);
  }
});
function closeClockModal() {
  document.getElementById('clockModal').style.display = 'none';
  clearInterval(window.clockTimer);
  window.clockTimer = null;
}

// --- Analog Clock Drawing ---
function drawAnalogClock() {
  const canvas = document.getElementById('analogClock');
  const ctx = canvas.getContext('2d');
  const radius = canvas.height / 2;
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.translate(radius, radius);

  // Clock face
  ctx.beginPath();
  ctx.arc(0, 0, radius * 0.9, 0, 2 * Math.PI);
  ctx.fillStyle = '#002222';
  ctx.fill();
  ctx.strokeStyle = '#00ffaa';
  ctx.lineWidth = 4;
  ctx.stroke();

  // Numbers
  ctx.fillStyle = '#00ffcc';
  ctx.font = radius * 0.2 + 'px Orbitron';
  ctx.textBaseline = 'middle';
  ctx.textAlign = 'center';
  for (let num = 1; num <= 12; num++) {
    const ang = (num * Math.PI) / 6;
    ctx.rotate(ang);
    ctx.translate(0, -radius * 0.75);
    ctx.rotate(-ang);
    ctx.fillText(num.toString(), 0, 0);
    ctx.rotate(ang);
    ctx.translate(0, radius * 0.75);
    ctx.rotate(-ang);
  }

  // Hands
  const now = new Date();
  let hour = now.getHours();
  hour = hour % 12;
  hour = (hour * Math.PI) / 6 + (now.getMinutes() * Math.PI) / 360;
  drawHand(ctx, hour, radius * 0.5, 6);
  const minute = (now.getMinutes() * Math.PI) / 30;
  drawHand(ctx, minute, radius * 0.7, 4);
  const second = (now.getSeconds() * Math.PI) / 30;
  drawHand(ctx, second, radius * 0.9, 2, '#ff6666');

  ctx.translate(-radius, -radius);
}

function drawHand(ctx, pos, length, width, color = '#00ffcc') {
  ctx.beginPath();
  ctx.lineWidth = width;
  ctx.lineCap = 'round';
  ctx.strokeStyle = color;
  ctx.moveTo(0, 0);
  ctx.rotate(pos);
  ctx.lineTo(0, -length);
  ctx.stroke();
  ctx.rotate(-pos);
}


 const input = document.getElementById('searchInput');
    const container = document.getElementById('quotesContainer');

    input.addEventListener('input', async () => {
      const res = await fetch(`http://localhost:5000/api/quotes?search=${input.value}`);
      const quotes = await res.json();
      container.innerHTML = quotes.map(q => `
        <div class="quote">
          <div>${q.text}</div>
          <div class="author">- ${q.author || 'Unknown'}</div>
        </div>
      `).join('');
    });

    function openQuoteModal() {
  document.getElementById('quoteModal').style.display = 'flex';
}

function closeQuoteModal() {
  document.getElementById('quoteModal').style.display = 'none';
  document.getElementById('quoteText').value = '';
  document.getElementById('quoteAuthor').value = '';
  document.getElementById('quoteTags').value = '';
}

async function submitQuote() {
  const text = document.getElementById('quoteText').value.trim();
  const author = document.getElementById('quoteAuthor').value.trim();
  const tags = document.getElementById('quoteTags').value.trim().split(',').map(tag => tag.trim()).filter(Boolean);

  if (!text) {
    alert('Quote text is required.');
    return;
  }

  const res = await fetch('http://localhost:5000/api/quotes', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ text, author, tags })
  });

  if (res.ok) {
    alert('✅ Quote added!');
    closeQuoteModal();
    input.dispatchEvent(new Event('input')); // refresh the list
  } else {
    alert('❌ Failed to add quote');
  }
}
