});

// --- Analog Clock Drawing ---
function drawAnalogClock() {
  const canvas = document.getElementById('analogClock');
  const ctx = canvas.getContext('2d');
  const radius = canvas.height / 2;
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.translate(radius, radius);

  // Clock face
  ctx.beginPath();
  ctx.arc(0, 0, radius * 0.9, 0, 2 * Math.PI);
  ctx.fillStyle = '#002222';
  ctx.fill();
  ctx.strokeStyle = '#00ffaa';
  ctx.lineWidth = 4;
  ctx.stroke();

  // Numbers
  ctx.fillStyle = '#00ffcc';
  ctx.font = radius * 0.2 + 'px Orbitron';
  ctx.textBaseline = 'middle';
  ctx.textAlign = 'center';
  for (let num = 1; num <= 12; num++) {
    const ang = (num * Math.PI) / 6;
    ctx.rotate(ang);
    ctx.translate(0, -radius * 0.75);
    ctx.rotate(-ang);
    ctx.fillText(num.toString(), 0, 0);
    ctx.rotate(ang);
    ctx.translate(0, radius * 0.75);
    ctx.rotate(-ang);
  }

  // Hands
  const now = new Date();
  let hour = now.getHours();
  hour = hour % 12;
  hour = (hour * Math.PI) / 6 + (now.getMinutes() * Math.PI) / 360;
  drawHand(ctx, hour, radius * 0.5, 6);
  const minute = (now.getMinutes() * Math.PI) / 30;
  drawHand(ctx, minute, radius * 0.7, 4);
  const second = (now.getSeconds() * Math.PI) / 30;
  drawHand(ctx, second, radius * 0.9, 2, '#ff6666');

  ctx.translate(-radius, -radius);
}

function drawHand(ctx, pos, length, width, color = '#00ffcc') {
  ctx.beginPath();
  ctx.lineWidth = width;
  ctx.lineCap = 'round';
  ctx.strokeStyle = color;
  ctx.moveTo(0, 0);
  ctx.rotate(pos);
  ctx.lineTo(0, -length);
  ctx.stroke();
  ctx.rotate(-pos);
}

const backend = 'http://localhost:5000/api/tasks';

  async function createTask() {
  const title = document.getElementById('newTaskInput').value;
  if (!title) return alert("Task cannot be empty");

  try {
    const res = await fetch('http://localhost:5000/api/tasks', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ title })
    });

    const data = await res.json();
    console.log('Task created:', data);
    loadTasks();
  } catch (err) {
    console.error('Failed to create task', err);
  }
}

async function loadTasks() {
  const res = await fetch('http://localhost:5000/api/tasks');
  const tasks = await res.json();
  const todo = document.getElementById('todo');
  todo.innerHTML = '';
  tasks.forEach(t => {
    const div = document.createElement('div');
    div.classList.add('task');
    div.textContent = `${t.title} - ${t.status}`;
    todo.appendChild(div);
  });
}

window.onload = loadTasks;
