  <script>

// Date & time updater
function updateDateTime() {
  const now = new Date();
  document.getElementById('dateDisplay').textContent = now.toLocaleDateString();
  document.getElementById('timeDisplay').textContent = now.toLocaleTimeString();
}
setInterval(updateDateTime, 1000);
updateDateTime();

// Dark mode toggle
const darkModeToggle = document.getElementById("darkModeToggle");
if (darkModeToggle) {
  darkModeToggle.addEventListener("click", () => {
    document.body.classList.toggle("dark-mode");
  });
}



// Bladder Dice Game Logic
const board = document.getElementById("board");
const ladders = { 3: 22, 5: 8, 11: 26, 20: 29, 27: 41, 35: 72, 45: 53, 69: 89, 78: 98 };
const snakes = { 17: 4, 19: 7, 21: 9, 27: 1, 38: 14, 47: 26, 56: 33, 64: 60, 87: 24, 99: 78 };
const winningPos = 100;

let p1Pos = 0;
let p2Pos = 0;
let currentPlayer = 1;

// Create board cells
for (let i = 100; i >= 1; i--) {
  const cell = document.createElement("div");
  cell.classList.add("cell");
  cell.setAttribute("data-cell", i);
  cell.textContent = i;

  if (snakes[i]) cell.classList.add("snake");
  else if (ladders[i]) cell.classList.add("ladder");

  board.appendChild(cell);
}

// Utility to update tokens on the board
function updateTokens() {
  document.querySelectorAll(".token").forEach(t => t.remove());

  if (p1Pos > 0) {
    const cell = document.querySelector(`[data-cell="${p1Pos}"]`);
    const token = document.createElement("div");
    token.classList.add("token", "p1");
    cell.appendChild(token);
  }

  if (p2Pos > 0) {
    const cell = document.querySelector(`[data-cell="${p2Pos}"]`);
    const token = document.createElement("div");
    token.classList.add("token", "p2");
    cell.appendChild(token);
  }
}

function applySnakesAndLadders(pos) {
  if (ladders[pos]) {
    alert(`🪜 Ladder! Climb from ${pos} to ${ladders[pos]}`);
    return ladders[pos];
  } else if (snakes[pos]) {
    alert(`🐍 Snake! Slide from ${pos} to ${snakes[pos]}`);
    return snakes[pos];
  }
  return pos;
}

document.getElementById("rollBtn").addEventListener("click", () => {
  const roll = Math.floor(Math.random() * 6) + 1;
  document.getElementById("diceResult").textContent = `🎲 Rolled: ${roll}`;

  if (currentPlayer === 1) {
    p1Pos += roll;
    if (p1Pos > winningPos) p1Pos = winningPos;
    p1Pos = applySnakesAndLadders(p1Pos);
    document.getElementById("p1Pos").textContent = `Player 1 Position: ${p1Pos}`;
    if (p1Pos >= winningPos) {
      document.getElementById("winner").textContent = "🏆 Player 1 Wins!";
      document.getElementById("rollBtn").disabled = true;
    } else {
      currentPlayer = 2;
      document.getElementById("turn").textContent = "Player 2's turn";
    }
  } else {
    p2Pos += roll;
    if (p2Pos > winningPos) p2Pos = winningPos;
    p2Pos = applySnakesAndLadders(p2Pos);
    document.getElementById("p2Pos").textContent = `Player 2 Position: ${p2Pos}`;
    if (p2Pos >= winningPos) {
      document.getElementById("winner").textContent = "🏆 Player 2 Wins!";
      document.getElementById("rollBtn").disabled = true;
    } else {
      currentPlayer = 1;
      document.getElementById("turn").textContent = "Player 1's turn";
    }
  }

  updateTokens();
});

// --- Theme Switcher ---//

  const themeSelector = document.getElementById('themeSelector');

  // Load stored theme
  document.addEventListener('DOMContentLoaded', () => {
    const savedTheme = localStorage.getItem('selectedTheme');
    if (savedTheme) {
      document.body.setAttribute('data-theme', savedTheme);
      themeSelector.value = savedTheme;
    }
  });

  themeSelector.addEventListener('change', function () {
    const selected = this.value;
    document.body.setAttribute('data-theme', selected);
    localStorage.setItem('selectedTheme', selected);
  });

  window.addEventListener("DOMContentLoaded", function () {
    const userPhoto = localStorage.getItem("userPhoto");
    if (userPhoto) {
      document.getElementById("navbar-avatar").src = userPhoto;
    }
  });


  </script>
