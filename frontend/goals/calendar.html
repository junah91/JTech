// --- Analog Clock Drawing ---
function drawAnalogClock() {
  const canvas = document.getElementById('analogClock');
  const ctx = canvas.getContext('2d');
  const radius = canvas.height / 2;
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.translate(radius, radius);

  // Clock face
  ctx.beginPath();
  ctx.arc(0, 0, radius * 0.9, 0, 2 * Math.PI);
  ctx.fillStyle = '#002222';
  ctx.fill();
  ctx.strokeStyle = '#00ffaa';
  ctx.lineWidth = 4;
  ctx.stroke();

  // Numbers
  ctx.fillStyle = '#00ffcc';
  ctx.font = radius * 0.2 + 'px Orbitron';
  ctx.textBaseline = 'middle';
  ctx.textAlign = 'center';
  for (let num = 1; num <= 12; num++) {
    const ang = (num * Math.PI) / 6;
    ctx.rotate(ang);
    ctx.translate(0, -radius * 0.75);
    ctx.rotate(-ang);
    ctx.fillText(num.toString(), 0, 0);
    ctx.rotate(ang);
    ctx.translate(0, radius * 0.75);
    ctx.rotate(-ang);
  }

  // Hands
  const now = new Date();
  let hour = now.getHours();
  hour = hour % 12;
  hour = (hour * Math.PI) / 6 + (now.getMinutes() * Math.PI) / 360;
  drawHand(ctx, hour, radius * 0.5, 6);
  const minute = (now.getMinutes() * Math.PI) / 30;
  drawHand(ctx, minute, radius * 0.7, 4);
  const second = (now.getSeconds() * Math.PI) / 30;
  drawHand(ctx, second, radius * 0.9, 2, '#ff6666');

  ctx.translate(-radius, -radius);
}

function drawHand(ctx, pos, length, width, color = '#00ffcc') {
  ctx.beginPath();
  ctx.lineWidth = width;
  ctx.lineCap = 'round';
  ctx.strokeStyle = color;
  ctx.moveTo(0, 0);
  ctx.rotate(pos);
  ctx.lineTo(0, -length);
  ctx.stroke();
  ctx.rotate(-pos);
}

let currentMonth = new Date().getMonth();
let currentYear = new Date().getFullYear();
let selectedDate = '';

function renderCalendar(month, year) {
  const calendar = document.getElementById('calendar');
  const monthYear = document.getElementById('monthYear');
  const firstDay = new Date(year, month).getDay();
  const daysInMonth = new Date(year, month + 1, 0).getDate();

  const months = ["January", "February", "March", "April", "May", "June",
                  "July", "August", "September", "October", "November", "December"];

  monthYear.textContent = `${months[month]} ${year}`;
  calendar.innerHTML = '';

  const header = `<tr><th>Sun</th><th>Mon</th><th>Tue</th><th>Wed</th>
                     <th>Thu</th><th>Fri</th><th>Sat</th></tr>`;
  calendar.innerHTML += header;

  let date = 1;
  for (let i = 0; i < 6; i++) {
    let row = '<tr>';
    for (let j = 0; j < 7; j++) {
      if (i === 0 && j < firstDay) {
        row += '<td></td>';
      } else if (date > daysInMonth) {
        break;
      } else {
        const fullDate = `${year}-${(month + 1).toString().padStart(2, '0')}-${date.toString().padStart(2, '0')}`;
        const hasReminder = localStorage.getItem(`reminder-${fullDate}`) ? 'has-reminder' : '';
        row += `<td class="${hasReminder}" onclick="openReminderModal('${fullDate}')">${date}</td>`;
        date++;
      }
    }
    row += '</tr>';
    calendar.innerHTML += row;
    if (date > daysInMonth) break;
  }
}

function prevMonth() {
  currentMonth--;
  if (currentMonth < 0) {
    currentMonth = 11;
    currentYear--;
  }
  renderCalendar(currentMonth, currentYear);
}

function nextMonth() {
  currentMonth++;
  if (currentMonth > 11) {
    currentMonth = 0;
    currentYear++;
  }
  renderCalendar(currentMonth, currentYear);
}

function openReminderModal(dateStr) {
  selectedDate = dateStr;
  document.getElementById('reminderModal').style.display = 'flex';
  document.getElementById('selectedDateTitle').textContent = `Reminder for ${dateStr}`;
  document.getElementById('reminderText').value = localStorage.getItem(`reminder-${dateStr}`) || '';
}

function closeReminderModal() {
  document.getElementById('reminderModal').style.display = 'none';
  selectedDate = '';
}

function saveReminder() {
  const text = document.getElementById('reminderText').value.trim();
  if (text) {
    localStorage.setItem(`reminder-${selectedDate}`, text);
  } else {
    localStorage.removeItem(`reminder-${selectedDate}`);
  }
  closeReminderModal();
  renderCalendar(currentMonth, currentYear);
}

// Initial render
renderCalendar(currentMonth, currentYear);
